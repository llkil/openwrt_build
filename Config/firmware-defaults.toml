# 固件默认设置

# 管理地址
lan_ip = "192.168.50.1"

# 无线名称
wifi_ssid = "ImmortalWrt"

# 无线密码
wifi_password = "12345678"

# 无线加密
wifi_encryption = "psk2"

# 无线国家代码（两位 ISO 码，决定可用信道与功率上限）
wifi_country = "CN"

# 5GHz 默认信道宽度；仅当驱动与该国家码允许 160MHz 时生效
wifi_5g_width = 160

# 关闭无线
wifi_disabled = false

# 界面主题
theme = "shadcn"

# 时区规则
timezone = "CST-8"

# 时区名称
zonename = "Asia/Shanghai"

# 管理密码哈希；留空不修改
root_password_hash = "$6$owrt7dr$OKg5HmoZKU7gEvT3FPwQF7Jn.6/.ocZt.e8L0aTr7vdrhZn3AqV6LstSgMESGfIZzaaG5cYOtxW06HRuVCif./"
